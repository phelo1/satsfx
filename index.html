<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SatsFX – Satoshi Time Machine</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #0f172a, #111827, #0b1021);
      color:#fff;
      min-height:100vh;
    }
    .container { max-width:1200px; margin:0 auto; padding:20px; }
    header { text-align:center; padding:40px 0; }
    h1 {
      font-size:3rem; margin-bottom:10px;
      background: linear-gradient(90deg, #f7931a, #ffcf70);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    }
    .subtitle { color:#f7931a; font-size:1.2rem; }
    .tabs { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-bottom:30px; }
    .tab {
      padding:12px 16px; background:#1f2937; border:2px solid #1f2937;
      color:#fff; cursor:pointer; border-radius:8px; font-weight:600;
      transition:all .2s ease;
    }
    .tab.active { background:#f7931a; color:#111827; box-shadow:0 0 16px rgba(247,147,26,.35); }
    .section { display:none; animation:fadeIn .4s ease; }
    .section.active { display:block; }
    @keyframes fadeIn { from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:translateY(0)} }
    .card { background:rgba(31,41,55,.75); border:1px solid #334155; border-radius:12px; padding:24px; margin-bottom:20px; }
    label { display:block; margin-bottom:8px; color:#f7931a; font-weight:600; }
    input, select, button {
      width:100%; padding:12px; border-radius:8px; border:1px solid #334155; background:#0f172a; color:#fff;
      font-size:1rem;
    }
    button { background:#f7931a; color:#111827; border:none; font-weight:700; cursor:pointer; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:16px; }
    .timeline-item { padding:16px; border-left:4px solid #f7931a; background:rgba(31,41,55,.6); border-radius:8px; margin-bottom:12px; }
    .vapor { height:240px; background:linear-gradient(to bottom, rgba(255,255,255,.2), rgba(255,255,255,0)); border-radius:10px; position:relative; overflow:hidden; }
    .vapor::after { content:"$"; position:absolute; top:-20px; left:50%; transform:translateX(-50%); font-size:4rem; opacity:.8; animation:vaporize 3s infinite; }
    @keyframes vaporize { 0%{top:100%; opacity:.2} 100%{top:-40px; opacity:0} }
    .footer { text-align:center; padding:30px 0; color:#94a3b8; font-size:.9rem; }
    .highlight { color:#fbbf24; font-weight:700; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Satoshi Time Machine</h1>
      <div class="subtitle">What if you bought Bitcoin?</div>
    </header>

    <div class="tabs">
      <button class="tab active" data-tab="timeline">Timeline</button>
      <button class="tab" data-tab="portfolio">What If?</button>
      <button class="tab" data-tab="inflation">Inflation</button>
      <button class="tab" data-tab="vapor">Vaporization</button>
      <button class="tab" data-tab="child">Child Future</button>
    </div>

    <section id="timeline" class="section active">
      <div class="card">
        <h2>Bitcoin Milestones</h2>
        <div id="timeline-list"></div>
      </div>
    </section>

    <section id="portfolio" class="section">
      <div class="card">
        <h2>What If Portfolio Simulator</h2>
        <div class="grid">
          <div>
            <label>USD Amount</label>
            <input type="number" id="usdAmount" value="10000" />
          </div>
          <div>
            <label>Investment Date</label>
            <input type="date" id="investmentDate" value="2020-01-01" />
          </div>
        </div>
        <div class="grid" style="margin-top:16px;">
          <div class="card"><div>BTC Bought</div><div id="btcBought" class="highlight"></div></div>
          <div class="card"><div>Today’s Value</div><div id="todayValue" class="highlight"></div></div>
          <div class="card"><div>Gain Multiple</div><div id="gainMultiple" class="highlight"></div></div>
        </div>
      </div>
    </section>

    <section id="inflation" class="section">
      <div class="card">
        <h2>Inflation Time Machine</h2>
        <label>Pick a year</label>
        <select id="inflationYear"></select>
        <div id="inflationResult" style="margin-top:12px;"></div>
      </div>
    </section>

    <section id="vapor" class="section">
      <div class="card">
        <h2>USD Vaporization Chart</h2>
        <p>USD purchasing power vs BTC is melting away.</p>
        <div class="vapor"></div>
      </div>
    </section>

    <section id="child" class="section">
      <div class="card">
        <h2>Child’s Bitcoin Birthday</h2>
        <div class="grid">
          <div>
            <label>Child DOB (post-2009)</label>
            <input type="date" id="childDob" value="2015-01-01" />
          </div>
          <div>
            <label>Investment Today (USD)</label>
            <input type="number" id="childInvestment" value="5000" />
          </div>
        </div>
        <div id="childResult" style="margin-top:12px;"></div>
      </div>
    </section>

    <div class="footer">Built with orange pills 🟠</div>
  </div>

  <script>
    const BTC_CURRENT = 120000;
    const priceByDate = {
      "2009-01-03":0.01, "2010-07-18":0.09, "2011-02-09":1, "2013-11-29":1000,
      "2014-09-19":400, "2016-04-15":420, "2017-12-17":20000, "2020-03-13":5000,
      "2021-11-10":69000, "2022-11-21":16000, "2024-01-01":45000
    };
    const timeline = [
      {year:2009, event:"Bitcoin Created – Genesis Block", price:0.01},
      {year:2010, event:"Pizza Day (10k BTC)", price:0.09},
      {year:2011, event:"BTC hits $1", price:1},
      {year:2013, event:"BTC hits $1,000", price:1000},
      {year:2017, event:"BTC hits $20,000", price:20000},
      {year:2021, event:"BTC hits $69,000", price:69000},
      {year:2024, event:"ETF wave – $120,000", price:120000}
    ];

    const timelineList = document.getElementById("timeline-list");
    timeline.forEach(m => {
      const div = document.createElement("div");
      div.className = "timeline-item";
      div.innerHTML = `<strong>${m.year}</strong> — ${m.event}<br>Price: $${m.price}`;
      timelineList.appendChild(div);
    });

    function updatePortfolio(){
      const usd = Number(document.getElementById("usdAmount").value || 0);
      const d = document.getElementById("investmentDate").value;
      const price = priceByDate[d] || 400;
      const btc = usd / price;
      const now = btc * BTC_CURRENT;
      document.getElementById("btcBought").textContent = btc.toFixed(6) + " BTC";
      document.getElementById("todayValue").textContent = "$" + now.toLocaleString();
      document.getElementById("gainMultiple").textContent = (now/usd).toFixed(1) + "x";
    }
    document.getElementById("usdAmount").addEventListener("input", updatePortfolio);
    document.getElementById("investmentDate").addEventListener("input", updatePortfolio);
    updatePortfolio();

    const inflationYear = document.getElementById("inflationYear");
    const inflationData = {
      2009:{item:"iPhone 3GS", price:199, btc:Infinity},
      2010:{item:"iPad 1", price:499, btc:5544},
      2014:{item:"iPhone 6", price:649, btc:1.6},
      2017:{item:"iPhone X", price:999, btc:0.05},
      2021:{item:"iPhone 13", price:799, btc:0.01}
    };
    Object.keys(inflationData).forEach(y=>{
      const opt = document.createElement("option");
      opt.value = y; opt.textContent = y; inflationYear.appendChild(opt);
    });
    function updateInflation(){
      const y = inflationYear.value; const d = inflationData[y];
      const btc = d.btc===Infinity ? "∞" : d.btc.toFixed(4);
      const val = d.btc===Infinity ? "∞" : "$"+(d.btc*BTC_CURRENT).toLocaleString();
      document.getElementById("inflationResult").innerHTML =
        `<strong>${d.item}</strong> cost $${d.price} in ${y}. That was ${btc} BTC. Today: ${val}`;
    }
    inflationYear.addEventListener("change", updateInflation);
    updateInflation();

    function updateChild(){
      const dob = new Date(document.getElementById("childDob").value);
      const invest = Number(document.getElementById("childInvestment").value || 0);
      const age = 65; const now = new Date();
      const years = age - (now.getFullYear() - dob.getFullYear());
      const btc = invest / BTC_CURRENT;
      const pess = btc * Math.pow(1.3, years) * BTC_CURRENT;
      const avg = btc * Math.pow(1.5, years) * BTC_CURRENT;
      const bull = btc * Math.pow(1.75, years) * BTC_CURRENT;
      document.getElementById("childResult").innerHTML =
        `Years to retire: <strong>${years}</strong><br>`+
        `Pessimistic: $${pess.toLocaleString()}<br>`+
        `Average: $${avg.toLocaleString()}<br>`+
        `Bullish: $${bull.toLocaleString()}`;
    }
    document.getElementById("childDob").addEventListener("input", updateChild);
    document.getElementById("childInvestment").addEventListener("input", updateChild);
    updateChild();

    // tabs
    document.querySelectorAll('.tab').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
        document.getElementById(btn.dataset.tab).classList.add('active');
      });
    });
  </script>
</body>
</html>
